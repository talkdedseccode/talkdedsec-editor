<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Talkdedsec editor — no telemetry, boots in 0.41 seconds">
<title>Talkdedsec</title>
<style>
  .r{opacity:0;animation:r .7s cubic-bezier(.22,1,.36,1) both}
  .l{transform-box:fill-box;transform-origin:left center;animation:l .9s cubic-bezier(.22,1,.36,1) .3s both}
  @keyframes r{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
  @keyframes l{from{transform:scaleX(0)}to{transform:scaleX(1)}}
  @media (prefers-reduced-motion:reduce){.r,.l{animation:none;opacity:1;transform:none}}
</style>
<rect width="1200" height="300" fill="#0b0b0c"/>
<rect x="0.5" y="0.5" width="1199" height="299" fill="none" stroke="#232428"/>
<text class="r" x="64" y="74" font-family="ui-monospace,'Cascadia Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="15" letter-spacing="5.5" fill="#8f959e">TALKDEDSEC EDITOR</text>
<text class="r" style="animation-delay:.08s" x="60" y="172" font-family="'Segoe UI',Inter,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="88" font-weight="700" letter-spacing="-3" fill="#f2f3f5">Boots in 0.41 s.</text>
<text class="r" style="animation-delay:.16s" x="64" y="216" font-family="'Segoe UI',Inter,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="26" font-weight="500" fill="#c9cdd4">Nothing you did not install. Nothing dials out.</text>
<line class="l" x1="64" y1="248" x2="1136" y2="248" stroke="#232428"/>
<g font-family="ui-monospace,'Cascadia Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace">
  <text class="r" style="animation-delay:.5s"  x="64"   y="282" font-size="24" font-weight="600" fill="#f2f3f5">9<tspan font-size="15" fill="#8f959e"> PROCESSES</tspan></text>
  <text class="r" style="animation-delay:.6s"  x="270"  y="282" font-size="24" font-weight="600" fill="#f2f3f5">64<tspan font-size="15" fill="#8f959e"> EXTENSIONS</tspan></text>
  <text class="r" style="animation-delay:.7s"  x="520"  y="282" font-size="24" font-weight="600" fill="#f2f3f5">0<tspan font-size="15" fill="#8f959e"> TELEMETRY</tspan></text>
  <text class="r" style="animation-delay:.8s"  x="770"  y="282" font-size="24" font-weight="600" fill="#f2f3f5">0<tspan font-size="15" fill="#8f959e"> SOURCE MAPS</tspan></text>
  <text class="r" style="animation-delay:.9s" x="1136" y="282" text-anchor="end" font-size="15" fill="#8f959e">WINDOWS x64 · v1.130.0</text>
</g>
</svg>
